<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H2O 게임즈 — 혼자 만드는 게임들</title>
<meta name="description" content="혼자 만드는 게임 셋 — 도트 생존 서울탈출, 1인칭 조선 판타지 조선좀비, 어르신 · 어린이를 위한 협동 게임 기울기 볼.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg1:#1d1035;--bg2:#4a1f4f;--c1:#a78bfa;--c2:#93c5fd;--c3:#fb7185;--c4:#fdba74;--c5:#f0abfc;--ink:#f5f3ff}
body{font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;background:#0b0816;color:#ece8f7;overflow:hidden}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:29px;font-weight:800;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--c2),var(--c1),var(--c3),var(--c4));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin-top:8px;color:#aaa2c2;font-size:14.5px;line-height:1.65}
.lead b{color:#fff}

/* ── 무대 ── */
.stage{position:relative;height:100vh;height:100dvh;min-height:560px;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);user-select:none;touch-action:none}
.mesh{position:absolute;inset:-25%;pointer-events:none}
.mesh i{position:absolute;width:62%;height:62%;border-radius:50%;background:radial-gradient(circle,var(--c) 0%,transparent 64%);opacity:.4;mix-blend-mode:screen;animation:drift 24s ease-in-out infinite alternate}
.mesh i:nth-child(1){left:2%;top:0%}
.mesh i:nth-child(2){right:0%;top:6%;animation-duration:29s;animation-delay:-6s}
.mesh i:nth-child(3){left:12%;bottom:0%;animation-duration:33s;animation-delay:-12s}
.mesh i:nth-child(4){right:6%;bottom:4%;animation-duration:27s;animation-delay:-3s}
.mesh i:nth-child(5){left:30%;top:28%;opacity:.3;animation-duration:38s;animation-delay:-18s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(9%,-7%) scale(1.12)}100%{transform:translate(-8%,6%) scale(.94)}}
/* 성운 결(한 번만 그림) */
#neb{position:absolute;left:-5%;top:-5%;width:110%;height:110%;pointer-events:none;animation:nebd 80s ease-in-out infinite alternate}
@keyframes nebd{to{transform:translate(2.4%,-1.8%) scale(1.03)}}
canvas.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 76% 72% at 50% 50%,transparent 40%,rgba(5,2,14,.7) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.075;mix-blend-mode:overlay;background-size:180px}

.nav{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:24px;padding:17px 28px;font-size:13.5px;letter-spacing:.02em;background:linear-gradient(rgba(5,3,15,.6),rgba(5,3,15,0))}
.nav .logo{margin-right:auto;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.04em}
.nav .logo i{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:radial-gradient(circle,#fff 0 2.5px,transparent 3px)}
.nav .logo{text-decoration:none;color:inherit}
.nav a.m{opacity:.6;color:inherit;text-decoration:none;white-space:nowrap;transition:opacity .2s}
.nav a.m:hover{opacity:.9}
.nav a.m.on{opacity:1;font-weight:600;position:relative}
.nav a.m.on:after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:#fff}
@media (max-width:860px){.nav{gap:16px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav .logo{margin-right:8px;white-space:nowrap}.side{display:none}}

.scene{position:absolute;inset:0;perspective:1250px;perspective-origin:50% 46%}
.cyl{position:absolute;left:50%;top:53%;width:0;height:0;transform-style:preserve-3d}
.core{position:absolute;left:50%;top:0;bottom:0;width:560px;transform:translateX(-50%);background:radial-gradient(ellipse 50% 60% at 50% 52%,color-mix(in srgb,var(--c1) 22%,transparent),transparent 70%);pointer-events:none}
.ringc{position:absolute;border-radius:50%;border:1px solid rgba(206,214,255,.09)}
.rib{position:absolute;width:1px;background:linear-gradient(transparent,rgba(222,226,255,.13) 30%,rgba(222,226,255,.13) 70%,transparent)}
.panel{position:absolute;width:360px;height:232px;left:-180px;top:-116px;backface-visibility:hidden;border-radius:14px;padding:22px 22px 18px;cursor:pointer;
  background:linear-gradient(165deg,rgba(26,16,48,.86),rgba(46,20,58,.82));border:1px solid rgba(255,255,255,.11);
  box-shadow:0 24px 50px rgba(4,2,12,.45);transition:box-shadow .3s,border-color .3s}
.panel:before{content:"";position:absolute;left:22px;top:-1px;width:44px;height:2px;background:var(--pc)}
.panel.on{border-color:rgba(255,255,255,.22);box-shadow:0 24px 60px rgba(4,2,12,.5),0 0 44px color-mix(in srgb,var(--pc) 20%,transparent)}
.panel.on:hover{border-color:rgba(255,255,255,.4)}
.panel small{font-size:11px;font-weight:600;letter-spacing:.12em;color:color-mix(in srgb,var(--pc) 72%,#fff)}
.panel h4{font-size:28px;font-weight:700;letter-spacing:-.025em;margin-top:8px;line-height:1.2;color:#fff}
.panel p{font-size:13px;line-height:1.6;color:rgba(236,232,247,.72);margin-top:8px}
.tags{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.tags em{font-style:normal;font-size:11px;font-weight:500;letter-spacing:.03em;padding:3px 8px;border-radius:4px;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.03)}
.panel .shot{margin-top:12px;height:92px;border-radius:8px;display:grid;place-items:center;font-size:11.5px;letter-spacing:.04em;color:rgba(255,255,255,.55);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 8px,transparent 8px 16px),radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--pc) 14%,transparent),transparent 70%),rgba(8,5,18,.5);border:1px solid rgba(255,255,255,.09)}
.panel .shot{padding:0;overflow:hidden}
.panel .shot img{width:100%;height:100%;object-fit:cover;display:block}
.panel .num{position:absolute;right:18px;top:17px;font-size:11px;letter-spacing:.08em;opacity:.42;font-variant-numeric:tabular-nums}
.panel .more{position:absolute;right:20px;bottom:15px;font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.62);opacity:0;transition:opacity .3s}
.panel.on .more{opacity:1}
.panel .play{position:absolute;left:22px;bottom:13px;font-size:12px;letter-spacing:.03em;color:#fff;text-decoration:none;padding:5px 12px;border-radius:6px;border:1px solid color-mix(in srgb,var(--pc) 62%,transparent);background:color-mix(in srgb,var(--pc) 20%,transparent);transition:background .2s}
.panel .play:hover{background:color-mix(in srgb,var(--pc) 34%,transparent)}
.panel:not(.on) .play{pointer-events:none}
.play.soon,.dlg-play.soon,.play.pc-off,.dlg-play.pc-off{opacity:.5;cursor:default;pointer-events:none}

.count{position:absolute;left:30px;bottom:28px;z-index:5;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.count b{font-size:42px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.count span{font-size:14px;opacity:.5;margin-left:6px}
.count p{font-size:12px;letter-spacing:.08em;opacity:.65;margin-top:2px}
.side{position:absolute;right:28px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:10px}
.side a{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.02em;opacity:.45;cursor:pointer;transition:opacity .2s}
.side a i{width:12px;height:1px;background:rgba(255,255,255,.7);transition:width .3s,background .3s}
.side a:hover{opacity:.8}
.side a.on{opacity:1}
.side a.on i{width:24px;background:var(--pc)}
.ctl{position:absolute;right:26px;bottom:26px;z-index:5;display:flex;gap:8px}
.ctl button{font:inherit;font-size:12px;letter-spacing:.02em;color:rgba(255,255,255,.68);background:rgba(10,6,22,.35);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:7px 12px;cursor:pointer}
.ctl button.on{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.08)}
.hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:5;font-size:12px;letter-spacing:.04em;opacity:.55;display:flex;align-items:center;gap:8px}
.hint i{width:13px;height:21px;border:1px solid currentColor;border-radius:8px;position:relative}
.hint i:after{content:"";position:absolute;left:50%;top:4px;width:1.5px;height:5px;margin-left:-.75px;border-radius:2px;background:currentColor;animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}100%{transform:translateY(7px);opacity:0}}

/* ── 상세 창 ── */
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:3vh 3vw;visibility:hidden;opacity:0;transition:opacity .3s,visibility 0s .3s}
.dlg.open{visibility:visible;opacity:1;transition:opacity .3s}
.dlg-bg{position:absolute;inset:0;background:rgba(6,3,16,.62);backdrop-filter:blur(8px)}
.dlg-box{position:relative;width:min(1060px,100%);max-height:94vh;overflow:auto;display:grid;grid-template-columns:1.4fr 1fr;gap:30px;padding:30px;border-radius:16px;color:var(--ink);
  background:linear-gradient(165deg,rgba(24,14,44,.97),rgba(42,18,54,.96));border:1px solid rgba(255,255,255,.12);
  box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 90px color-mix(in srgb,var(--pc) 13%,transparent);transform:translateY(18px) scale(.985);transition:transform .5s cubic-bezier(.2,.75,.2,1)}
.dlg.open .dlg-box{transform:none}
.dlg-box:before{content:"";position:absolute;left:30px;top:-1px;width:64px;height:2px;background:var(--pc)}
.dlg-x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);cursor:pointer;z-index:2}
.dlg-x:before,.dlg-x:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1.5px;background:#fff;transform:translate(-50%,-50%) rotate(45deg)}
.dlg-x:after{transform:translate(-50%,-50%) rotate(-45deg)}
.dlg-x:hover{background:rgba(255,255,255,.1)}
.ph{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px),radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--pc) 16%,transparent),transparent 70%),#0d0919;border:1px solid rgba(255,255,255,.1)}
.ph .play{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:rgba(8,5,18,.4)}
.ph .play:after{content:"";position:absolute;left:50%;top:50%;margin:-11px 0 0 -6px;border-left:18px solid rgba(255,255,255,.92);border-top:11px solid transparent;border-bottom:11px solid transparent}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .lab{position:absolute;left:10px;bottom:9px;font-size:11.5px;letter-spacing:.03em;padding:3px 8px;border-radius:4px;background:rgba(8,5,18,.66);color:rgba(255,255,255,.85);pointer-events:none}
.dlg-main .ph.vid .lab{display:none}
.dlg-th{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.dlg-th .ph{cursor:pointer;opacity:.55;border-radius:6px;transition:opacity .2s,border-color .2s}
.dlg-th .ph:hover{opacity:.85}
.dlg-th .ph.on{opacity:1;border-color:rgba(255,255,255,.55)}
.dlg-th .ph .play{width:26px;height:26px;margin:-13px 0 0 -13px;border-width:1px}
.dlg-th .ph .play:after{margin:-5px 0 0 -2.5px;border-left-width:8px;border-top-width:5px;border-bottom-width:5px}
.dlg-th .ph .lab{left:5px;bottom:5px;font-size:10px;letter-spacing:.02em;padding:2px 5px}
.dlg-txt{padding-top:6px;display:flex;flex-direction:column}
.dlg-txt small{font-size:11.5px;font-weight:600;letter-spacing:.14em;color:color-mix(in srgb,var(--pc) 72%,#fff)}
.dlg-txt h3{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin-top:10px;color:#fff;padding-right:30px}
.dlg-lead{font-size:15px;line-height:1.75;color:rgba(236,232,247,.8);margin-top:14px}
.dlg-txt ul{list-style:none;margin-top:18px}
.dlg-txt ul:empty{display:none}
.dlg-txt li{font-size:14px;line-height:1.55;padding:11px 0 11px 18px;border-top:1px solid rgba(255,255,255,.08);position:relative;color:rgba(255,255,255,.78)}
.dlg-txt li:last-child{border-bottom:1px solid rgba(255,255,255,.08)}
.dlg-txt li:before{content:"";position:absolute;left:2px;top:19px;width:5px;height:5px;background:var(--pc);transform:rotate(45deg)}
.dlg-txt li b{font-weight:600;color:#fff}
.dlg-go{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:13.5px;letter-spacing:.02em;color:#fff;text-decoration:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:10px 18px;transition:background .2s,border-color .2s}
.dlg-go:hover{background:rgba(255,255,255,.1);border-color:color-mix(in srgb,var(--pc) 70%,#fff)}
.dlg-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.dlg-acts .dlg-go{margin-top:0}.dlg-play[hidden]{display:none}
.dlg-play{background:color-mix(in srgb,var(--pc) 22%,transparent);border-color:color-mix(in srgb,var(--pc) 62%,transparent)}
.dlg-play:hover{background:color-mix(in srgb,var(--pc) 34%,transparent)}
.dlg-note{margin-top:auto;padding-top:20px;font-size:11.5px;line-height:1.6;color:rgba(255,255,255,.4)}
@media (max-width:760px){.dlg-box{grid-template-columns:1fr;padding:22px;gap:20px}.dlg-txt h3{font-size:28px}}

.foot-mini{position:absolute;right:28px;bottom:26px;z-index:5;font-size:11px;letter-spacing:.03em;color:rgba(255,255,255,.4);text-align:right;line-height:1.6}
@media (max-width:860px){.foot-mini{display:none}.count{left:18px;bottom:18px}.hint{bottom:20px}.side{display:none}}
@media (max-width:640px){.nav{flex-wrap:wrap;row-gap:8px;gap:14px;overflow:visible;font-size:13px}.nav .logo{flex-basis:100%;margin-right:0}}
</style>
</head>

 {c:'c1',k:'혼자 만드는 게임 공방',t:'H2O 게임즈',p:'혼자 만드는 게임 셋을 소개해요.<br>휠을 내려 원기둥을 돌려 보세요.',tags:['서울탈출','조선좀비','기울기 볼'],side:'처음',link:'about.html',lt:'만든 사람',

  cyl.style.transform=`translateZ(${-R}px) translateY(${-cur*dy}px) rotateY(${-cur*STEP}deg)`;
  if(dy&&Math.floor(cur)!==base)layout();else place(false);
  const near=Math.round(cur),nm=mod(near,N);
  panels.forEach(p=>{if(p._i==null)return;const rel=p._i-cur,c=Math.cos(rel*STEP*RAD);let o=c>0?.2+.8*c*c:0;if(dy)o*=Math.max(0,1-Math.abs(rel)*.16);p.style.opacity=o.toFixed(3);p.classList.toggle('on',p._i===near)});
  sides.forEach((a,i)=>a.classList.toggle('on',i===nm));
  document.getElementById('cnum').textContent=String(nm+1).padStart(2,'0');
  document.getElementById('cname').textContent=P[nm].side.replace('· ','');
  if(run&&!still&&!dlgOpen&&!document.hidden){T+=dt;drawFx(T,dt)}
  if(TEST)stage.dataset.t=target.toFixed(2)+'/'+cur.toFixed(2);
  requestAnimationFrame(frame);
}
/* 시험용: #k=판 · t=초 · still(멈춘 그림) · ice(가운데에 얼음 유성) · open=카드 */
if(h.has('k'))target=cur=+h.get('k');
layout();resize();addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,150)});
T=+(h.get('t')||0);
if(h.has('ice')){nextIce=99;spawnIce(true,W*.18,H*.22);for(let i=0;i<40;i++)stepIce(1/60);nextIce=99}
drawFx(T,0);
if(h.has('open'))openDetail(mod(+h.get('open'),N));
requestAnimationFrame(frame);
</script>
