<div id="boot" class="hidden" aria-hidden="true" data-notr><div class="bBox"><div class="bTop"><span class="bMsg"></span><span class="bPct">0%</span></div><div class="bBar"><i></i></div></div></div>
<style>@font-face { font-family: "Galmuri11"; font-weight: bold; src: url("font/Galmuri11-Bold.woff2") format("woff2"); font-display: swap; }
#boot { position: fixed; left: 0; right: 0; bottom: 13vh; z-index: 60; display: flex; justify-content: center; pointer-events: none; opacity: 1; transition: opacity .45s;
  font-family: "Galmuri11", "Malgun Gothic", monospace; font-weight: bold; -webkit-font-smoothing: none; }
#boot.hidden { display: none; }
#boot.out { opacity: 0; }
#boot .bBox { width: min(660px, 86vw); }
#boot .bTop { display: flex; align-items: flex-end; gap: 14px; height: 1.7em; margin-bottom: 10px; font-size: clamp(15px, 2.6vmin, 26px); }
#boot .bMsg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e8dab2; letter-spacing: 1px; text-shadow: 2px 2px 0 #000; transition: opacity .25s; }
#boot .bMsg.swap { opacity: 0; }
#boot .bPct { flex: none; width: 4.2em; text-align: right; color: #f0b25a; font-size: 1.3em; line-height: 1; letter-spacing: 1px; text-shadow: 2px 2px 0 #000, 0 0 8px #c8641c66; font-variant-numeric: tabular-nums; }
#boot .bBar { height: clamp(22px, 3.4vmin, 34px); padding: 4px; background: #0d0907; border: 2px solid #000; box-shadow: 0 0 0 2px #5a3a22, 0 0 0 4px #000, inset 0 2px 0 #0008; }
#boot .bBar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, #d58a36 0 12px, #5a2f12 12px 15px); box-shadow: inset 0 3px 0 #f6c17299, inset 0 -3px 0 #6a361299; transition: width .15s linear; }
</style>
<script>
(function() {
  try {
    var el = document.getElementById("boot");
    if (!el) return;
    var en = false;
    var M = en ? [ "Digging through a trash pile...", "Sneaking around the infected...", "Prying open a store's back door...", "Packing bottled water...", "Tuning the radio...", "Rebuilding the barricade...", "Wrapping a bandage...", "Scouting the street from a rooftop...", "Loading magazines...", "Creeping up the stairs...", "Marking a safe route on the map...", "Knocking on the shelter door...", "Checking canned food dates...", "Swapping flashlight batteries...", "Opening an abandoned car's trunk..." ] : [ "쓰레기 더미를 뒤지는 중…", "감염자를 피해 골목으로 돌아가는 중…", "편의점 뒷문을 따는 중…", "생수병을 가방에 챙기는 중…", "무전기 주파수를 맞추는 중…", "바리케이드를 다시 세우는 중…", "붕대를 감는 중…", "옥상에서 거리를 살피는 중…", "탄창을 채우는 중…", "발소리를 죽이고 계단을 오르는 중…", "지도에 안전한 길을 표시하는 중…", "셸터 문을 두드리는 중…", "통조림 유통기한을 확인하는 중…", "손전등 배터리를 갈아 끼우는 중…", "버려진 차 트렁크를 여는 중…" ];
    var msg = el.querySelector(".bMsg"), pct = el.querySelector(".bPct"), fill = el.querySelector(".bBar i");
    var base = location.href.replace(/[?#].*$/, "").replace(/[^\/]*$/, ""), sz = null, total = 0, t0 = performance.now(), shown = 0, end = false, on = false, mi = -1, tick = 0, timer = 0;
    try {
      performance.setResourceTimingBufferSize(1e3);
    } catch (e) {}
    function got() {
      if (!sz) return Math.min(.9, 1 - Math.exp(-(performance.now() - t0) / 12e3));
      var L = performance.getEntriesByType("resource"), seen = {}, n = 0;
      for (var i = 0; i < L.length; i++) {
        var u = L[i].name;
        if (u.indexOf(base) !== 0) continue;
        u = u.slice(base.length).replace(/[?#].*$/, "");
        if (sz[u] && !seen[u] && (u !== "js/lang-en.js" || en)) {
          seen[u] = 1;
          n += sz[u];
        }
      }
      return n / total;
    }
    function say() {
      var j;
      do {
        j = Math.floor(Math.random() * M.length);
      } while (j === mi && M.length > 1);
      mi = j;
      msg.classList.add("swap");
      setTimeout(function() {
        msg.textContent = M[mi];
        msg.classList.remove("swap");
      }, 250);
    }
    function step() {
      var target = end ? 100 : Math.min(99, Math.floor(got() * 100));
      if (target > shown) shown = Math.min(target, shown + Math.max(1, Math.ceil((target - shown) * (end ? .35 : .2))));
      fill.style.width = shown + "%";
      pct.textContent = shown + "%";
      if (++tick % 26 === 0) say();
      if (end && shown >= 100) {
        clearInterval(timer);
        setTimeout(function() {
          el.classList.add("out");
          setTimeout(function() {
            el.remove();
          }, 500);
        }, 300);
      }
    }
    setTimeout(function() {
      if (end) {
        el.remove();
        return;
      }
      on = true;
      el.classList.remove("hidden");
      mi = Math.floor(Math.random() * M.length);
      msg.textContent = M[mi];
      step();
      timer = setInterval(step, 100);
    }, 400);
    document.addEventListener("DOMContentLoaded", function() {
      end = true;
      if (!on) el.remove();
    });
  } catch (err) {}
})();
</script>
